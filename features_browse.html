<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAYNUPZINE — Feature</title>
<style>
  :root{
    --ink:#222; --muted:#666; --brand:#111; --chip:#eef1f5;
    --panel:rgba(255,255,255,.6);
    --line:#e5e7eb; --link:#2E66CC;
    --accent:#111; --danger:#a33;
  }

  html,body{
    margin:0; background:transparent; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:18px;
  }

  .bg{
    position:fixed; inset:0;
    background-color:#f3f5f7;
    background-size:cover; background-position:center;
    filter:brightness(.88); z-index:0;
  }

  .wrap{max-width:1080px; margin:28px auto; padding:0 16px;}

  .panel{
    position:relative; z-index:1;
    background:var(--panel);
    -webkit-backdrop-filter:saturate(120%) blur(10px);
    backdrop-filter:saturate(120%) blur(10px);
    border-radius:16px;
    box-shadow:0 10px 28px rgba(0,0,0,.6);
    padding:20px;
  }

  .langbar{display:flex; justify-content:flex-end; gap:8px; margin-bottom:8px}
  .langbtn{
    border:1px solid #ddd; background:#fff; color:#111; border-radius:999px;
    padding:8px 12px; font-size:14px; font-weight:900; cursor:pointer;
  }
  .langbtn.active{background:#111; color:#fff; border-color:#111}

  .top{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .brand{display:inline-block; background:var(--brand); color:#fff; border-radius:8px; padding:7px 12px; font-weight:800; letter-spacing:.4px}

  .title{font-size:26px; font-weight:800; margin:14px 0 6px}
  .meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px}
  .chip{background:var(--chip); border-radius:999px; padding:8px 12px; font-weight:700; font-size:14px}
  .author{color:var(--muted); font-size:14px}
  .divider{height:1px; background:var(--line); margin:14px 0}
  .para{padding:10px 0}
  .ptext{white-space:pre-wrap; line-height:1.7}
  .thumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px}
  .thumbs img{width:100%; height:180px; object-fit:cover; border-radius:10px; background:#fff}
  @media (max-width:780px){ .thumbs img{height:120px} }
  .yt{position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; margin-top:10px}
  .yt iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  .tools{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap}
  .sharetools{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .back a{color:var(--link); text-decoration:none; font-weight:700}
  .id{color:#999; font-size:12px}
  .alert{margin:12px 0; padding:12px; border-radius:14px; background:#ffe9e9; color:#a33; border:1px solid #f6bcbc; font-size:16px; display:none}
  .alert.show{display:block}
  .okbox{margin:12px 0; padding:12px; border-radius:14px; background:#eefcf1; color:#0a7a32; border:1px solid #c6ecd1; font-size:16px; display:none}
  .okbox.show{display:block}
  .skeleton{animation:pulse 1.1s infinite ease-in-out; background:linear-gradient(90deg,#eee,#f7f7f7,#eee); border-radius:10px}
  @keyframes pulse{0%{background-position:0% 50%}100%{background-position:100% 50%}}
  .sk-title{height:28px; margin:16px 0}
  .sk-line{height:14px; margin:8px 0}

  .content{display:grid; grid-template-columns:1fr; gap:16px}
  .authorFooter{
    margin-top:18px; padding-top:14px; border-top:1px dashed #cfd6df;
    text-align:right; font-size:15px; font-weight:800; color:#333;
  }
  .authorFooter span{color:#666; font-weight:700; margin-right:6px}

  .editbox{
    margin-top:14px; padding:14px; border:1px dashed #b9c1cc;
    border-radius:12px; background:rgba(255,255,255,.72);
  }
  .edithead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
  .edittitle{font-weight:800; font-size:16px}
  .editBody{display:none; margin-top:12px}
  .editBody.show{display:block}
  .editrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .editrow3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px}
  @media(max-width:900px){ .editrow3{grid-template-columns:1fr} }
  @media(max-width:780px){ .editrow{grid-template-columns:1fr} }

  .lab{font-size:12px; color:#666; margin:0 0 6px; font-weight:700}
  .in,.ta{
    width:100%; box-sizing:border-box; border:1px solid #d0d7de; border-radius:10px;
    padding:10px 12px; font-size:15px; background:#fff; color:#111;
  }
  .ta{min-height:110px; resize:vertical}

  .edit-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
  .btn{
    border:0; border-radius:12px; padding:10px 14px; font-weight:800; cursor:pointer; font-size:14px;
    background:#111; color:#fff;
  }
  .btn:disabled{opacity:.6; cursor:default}
  .btn.ghost{background:#fff; color:#111; border:1px solid #d0d7de}
  .btn.warn{background:#fff0f0; color:#a33; border:1px solid #f3b9b9}
  .btn.secondary{background:#3949ab; color:#fff}
  .btn.sns-x{background:#111; color:#fff}
  .btn.sns-fb{background:#1877f2; color:#fff}
  .btn.sns-line{background:#06c755; color:#fff}

  .editpanel{display:block; margin-top:12px; border-top:1px solid #d8dee6; padding-top:12px}
  .smallnote{margin-top:6px; font-size:12px; color:#666}

  .sectionbox{
    border:1px solid #e3e8ef; border-radius:10px; padding:10px;
    background:#fff; margin-top:12px;
  }
  .sectionttl{font-weight:800; margin-bottom:8px; font-size:14px}
</style>

function L(){ return TEXT[currentLang] || TEXT.ja; }

function saveLang(){
  try{ localStorage.setItem('cz_lang', currentLang); }catch(_){}
  try{ document.documentElement.lang = currentLang; }catch(_){}
}

function setLangButtons(){
  var ja = document.getElementById('lang-ja');
  var en = document.getElementById('lang-en');
  if(ja) ja.classList.toggle('active', currentLang === 'ja');
  if(en) en.classList.toggle('active', currentLang === 'en');
}

function qs(k){
  var m = location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
  });
}

function pickLang(data, key){
  data = data || {};
  if(currentLang === 'en'){
    return String(data[key + '_en'] || data[key] || '').trim();
  }
  return String(data[key] || data[key + '_en'] || '').trim();
}

function normalizeHttps(u){
  try{
    if(!u) return '';
    if(/^https:\/\//i.test(u)) return u;
    if(/^http:\/\//i.test(u)) return u.replace(/^http:/i,'https:');
    return u;
  }catch(_){ return String(u||''); }
}

function extractDriveId(u){
  try{
    var s=String(u||'');
    var m=s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
    m=s.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
    m=s.match(/uc\?export=view&id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  }catch(_){}
  return '';
}

function buildImageSources(url){
  url = normalizeHttps(url);
  var arr=[]; if(!url) return arr;
  if(url.indexOf('images.unsplash.com')>=0){
    arr.push(url + (url.indexOf('?')>=0 ? '&w=1200' : '?w=1200'));
    return arr;
  }
  var id=extractDriveId(url);
  if(id){
    arr.push('https://drive.google.com/thumbnail?id='+id+'&sz=w1200');
    arr.push('https://drive.google.com/uc?export=view&id='+id);
    arr.push('https://lh3.googleusercontent.com/d/'+id);
  }
  if(/^https:\/\//i.test(url)) arr.push(url);
  return arr;
}

function ytId(u){
  try{
    var s = String(u||'').trim(); if(!s) return '';
    var url = new URL(normalizeHttps(s));
    var host = url.hostname.replace(/^www\./,'');
    if(host==='youtu.be'){
      var p = url.pathname.slice(1);
      return (/^[A-Za-z0-9_-]{6,}$/.test(p)?p:'');
    }
    if(host==='youtube.com' || host==='m.youtube.com'){
      var v = url.searchParams.get('v');
      if(v && /^[A-Za-z0-9_-]{6,}$/.test(v)) return v;
      var m = url.pathname.match(/\/embed\/([A-Za-z0-9_-]{6,})/);
      if(m) return m[1];
      var s2 = url.pathname.match(/\/shorts\/([A-Za-z0-9_-]{6,})/);
      if(s2) return s2[1];
    }
  }catch(_){}
  var m2 = String(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  return m2 ? m2[1] : '';
}

function isAllowedYouTube(u){
  if(!u) return true;
  return !!ytId(u);
}

function chip(text){
  var s=document.createElement('span');
  s.className='chip';
  s.textContent=text;
  return s;
}

function resolveExecUrl(){
  try{
    var injected = (window.EXEC_URL||'').trim();
    if (!injected || injected.indexOf('<?=')===0) injected = '';
    window.EXEC_URL = injected || GAS_EXEC_URL;
  }catch(_){
    window.EXEC_URL = GAS_EXEC_URL;
  }
}

function buildShareUrl(){
  var base = location.origin + location.pathname;
  var suffix = '&lang=' + encodeURIComponent(currentLang);

  if(gFeature && gFeature.slug){
    return base + '?slug=' + encodeURIComponent(gFeature.slug) + suffix;
  }

  if(gRowIndex){
    return base + '?row=' + encodeURIComponent(gRowIndex) + suffix;
  }

  return location.href;
}

function buildShareTitle(){
  var title = gFeature ? pickLang(gFeature, 'title') : '';
  var genre = gFeature && gFeature.genre ? String(gFeature.genre).trim() : '';
  var era = gFeature && gFeature.era ? String(gFeature.era).trim() : '';
  var region = gFeature && gFeature.region ? String(gFeature.region).trim() : '';

  var meta = [genre, era, region].filter(Boolean).join(' / ');

  if(title && meta){
    return title + '｜' + meta + ' | CHAYNUPZINE';
  }

  if(title){
    return title + ' | CHAYNUPZINE';
  }

  return 'CHAYNUPZINE Feature';
}

function openShareWindow(url){
  window.open(url, '_blank', 'noopener,noreferrer,width=640,height=640');
}

async function copyTextToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    await navigator.clipboard.writeText(text);
    return true;
  }

  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();

  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(_){ ok = false; }

  document.body.removeChild(ta);
  return ok;
}

function setupCopyButton(){
  var btn = document.getElementById('copyLinkBtn');
  if(!btn) return;

  btn.onclick = async function(){
    if(!gRowIndex && !(gFeature && gFeature.slug)){
      showErrorText(L().noInfo);
      return;
    }

    var url = buildShareUrl();

    try{
      var ok = await copyTextToClipboard(url);
      if(ok) showOkText(L().copied);
      else showErrorText(L().copyFail + url);
    }catch(_){
      showErrorText(L().copyFail + url);
    }
  };
}

function setupSnsShareButtons(){
  var xBtn = document.getElementById('shareXBtn');
  var fbBtn = document.getElementById('shareFacebookBtn');
  var lineBtn = document.getElementById('shareLineBtn');

  if(xBtn){
    xBtn.onclick = function(){
      if(!gRowIndex && !(gFeature && gFeature.slug)){
        showErrorText(L().noInfo);
        return;
      }
      openShareWindow('https://twitter.com/intent/tweet?text=' + encodeURIComponent(buildShareTitle()) + '&url=' + encodeURIComponent(buildShareUrl()));
    };
  }

  if(fbBtn){
    fbBtn.onclick = function(){
      if(!gRowIndex && !(gFeature && gFeature.slug)){
        showErrorText(L().noInfo);
        return;
      }
      openShareWindow('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(buildShareUrl()));
    };
  }

  if(lineBtn){
    lineBtn.onclick = function(){
      if(!gRowIndex && !(gFeature && gFeature.slug)){
        showErrorText(L().noInfo);
        return;
      }
      openShareWindow('https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(buildShareUrl()));
    };
  }
}

function renderHeader(data){
  var head = document.getElementById('head');
  head.innerHTML = '';

  var title = document.createElement('div');
  title.className='title';
  title.innerHTML = esc(pickLang(data, 'title') || '(No title)');
  head.appendChild(title);

  var meta = document.createElement('div');
  meta.className='meta';
  if(data.genre){ meta.appendChild(chip(String(data.genre))); }
  if(data.era){ meta.appendChild(chip(String(data.era))); }
  if(data.region){ meta.appendChild(chip(String(data.region))); }

  var author = document.createElement('span');
  author.className='author';
  author.textContent = data.author ? ('by ' + data.author) : '';
  meta.appendChild(author);
  head.appendChild(meta);
}

function renderAuthorFooter(data){
  var box = document.getElementById('authorFooter');
  if(!box) return;

  var author = String((data && data.author) || '').trim();
  if(!author){
    box.innerHTML = '';
    box.style.display = 'none';
    return;
  }

  box.style.display = 'block';
  box.innerHTML = '<span>' + L().author + '</span>' + esc(author);
}

function renderBody(data){
  var body = document.getElementById('body');
  body.innerHTML='';

  var any=false;
  for(var i=1;i<=5;i++){
    var text = pickLang(data, 'para'+i+'_text');
    var yt   = data['youtube'+i] || '';
    var imgs = [];
    for(var j=1;j<=3;j++){
      var u = data['p'+i+'_img'+j+'_url'];
      if(u) imgs.push(u);
    }
    if(!text && !imgs.length && !yt) continue;
    any=true;

    var sec = document.createElement('div');
    sec.className='para';

    if(text){
      var p = document.createElement('div');
      p.className='ptext';
      p.textContent = text;
      sec.appendChild(p);
    }

    if(imgs.length){
      var t = document.createElement('div');
      t.className='thumbs';
      imgs.forEach(function(u){
        var srcs = buildImageSources(u||'');
        if(srcs.length){
          var img = document.createElement('img');
          img.loading='lazy';
          img.decoding='async';
          img.alt='image';
          var k=0;
          function next(){
            if(k>=srcs.length){ return; }
            img.src=srcs[k++];
          }
          img.onerror=next;
          next();
          t.appendChild(img);
        }
      });
      sec.appendChild(t);
    }

    if(yt){
      var id = ytId(yt);
      if(id){
        var y = document.createElement('div');
        y.className='yt';
        var ifr = document.createElement('iframe');
        ifr.loading='lazy';
        ifr.src='https://www.youtube.com/embed/'+id;
        ifr.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        ifr.setAttribute('allowfullscreen','');
        y.appendChild(ifr);
        sec.appendChild(y);
      }
    }

    body.appendChild(sec);
  }

  if(!any){
    body.innerHTML = '<div class="ptext" style="color:#888">' + esc(L().noBody) + '</div>';
  }
}

function showErrorText(msg){
  var a = document.getElementById('alert');
  a.textContent = msg || 'Error';
  a.className='alert show';
  document.getElementById('okbox').className='okbox';
}

function showOkText(msg){
  var o = document.getElementById('okbox');
  o.textContent = msg || '';
  o.className = 'okbox show';
  document.getElementById('alert').className='alert';
}

function clearBanners(){
  document.getElementById('alert').className='alert';
  document.getElementById('okbox').className='okbox';
}

function buildEditSections(data){
  var host = document.getElementById('editSections');
  host.innerHTML = '';

  for(var i=1;i<=5;i++){
    var box = document.createElement('div');
    box.className = 'sectionbox';

    var ttl = document.createElement('div');
    ttl.className = 'sectionttl';
    ttl.textContent = '§' + i;
    box.appendChild(ttl);

    var textLab = document.createElement('div');
    textLab.className = 'lab';
    textLab.textContent = L().body;
    box.appendChild(textLab);

    var ta = document.createElement('textarea');
    ta.className = 'ta';
    ta.id = 'e_para' + i + '_text';
    ta.value = data['para'+i+'_text'] || '';
    box.appendChild(ta);

    var textEnLab = document.createElement('div');
    textEnLab.className = 'lab';
    textEnLab.style.marginTop = '10px';
    textEnLab.textContent = L().bodyEn;
    box.appendChild(textEnLab);

    var taEn = document.createElement('textarea');
    taEn.className = 'ta';
    taEn.id = 'e_para' + i + '_text_en';
    taEn.value = data['para'+i+'_text_en'] || '';
    box.appendChild(taEn);

    var ytLab = document.createElement('div');
    ytLab.className = 'lab';
    ytLab.style.marginTop = '10px';
    ytLab.textContent = 'YouTube URL';
    box.appendChild(ytLab);

    var yt = document.createElement('input');
    yt.className = 'in';
    yt.type = 'text';
    yt.id = 'e_youtube' + i;
    yt.value = data['youtube'+i] || '';
    box.appendChild(yt);

    for(var j=1;j<=3;j++){
      var il = document.createElement('div');
      il.className = 'lab';
      il.style.marginTop = '10px';
      il.textContent = L().imageUrl + j;
      box.appendChild(il);

      var inp = document.createElement('input');
      inp.className = 'in';
      inp.type = 'text';
      inp.id = 'e_p' + i + '_img' + j + '_url';
      inp.value = data['p'+i+'_img'+j+'_url'] || '';
      box.appendChild(inp);
    }

    host.appendChild(box);
  }
}

function fillEditForm(data){
  document.getElementById('e_title').value = data.title || '';
  document.getElementById('e_title_en').value = data.title_en || '';
  document.getElementById('e_author').value = data.author || '';
  document.getElementById('e_genre').value = data.genre || '';
  document.getElementById('e_era').value = data.era || '';
  document.getElementById('e_region').value = data.region || '';
  buildEditSections(data);
}

function clearEditForm(){
  document.getElementById('e_title').value = '';
  document.getElementById('e_title_en').value = '';
  document.getElementById('e_author').value = '';
  document.getElementById('e_genre').value = '';
  document.getElementById('e_era').value = '';
  document.getElementById('e_region').value = '';
  document.getElementById('editSections').innerHTML = '';
}

function openEditBox(){
  if(!gFeature){
    showErrorText(L().needTarget);
    return;
  }

  gIsEditOpen = true;
  document.getElementById('editBody').classList.add('show');
  document.getElementById('btnEditToggle').textContent = L().closeEdit;
  fillEditForm(gFeature);
  refreshTargetInfo();

  if(gLastEditKey){
    document.getElementById('editKey').value = gLastEditKey;
  }

  clearBanners();
}

function closeEditBox(){
  gIsEditOpen = false;
  document.getElementById('editBody').classList.remove('show');
  document.getElementById('btnEditToggle').textContent = L().edit;
  clearEditForm();
  clearBanners();
}

function collectPatch(){
  var patch = {
    title: (document.getElementById('e_title').value || '').trim(),
    title_en: (document.getElementById('e_title_en').value || '').trim(),
    author: (document.getElementById('e_author').value || '').trim(),
    genre: (document.getElementById('e_genre').value || '').trim(),
    era: (document.getElementById('e_era').value || '').trim(),
    region: (document.getElementById('e_region').value || '').trim()
  };

  if(gFeature && gFeature.slug){
    patch.slug = gFeature.slug;
  }
  if(gFeature && Object.prototype.hasOwnProperty.call(gFeature, 'genre_other')){
    patch.genre_other = gFeature.genre_other || '';
  }
  patch.status = (gFeature && gFeature.status) ? gFeature.status : 'published';

  for(var i=1;i<=5;i++){
    patch['para'+i+'_text'] = ((document.getElementById('e_para'+i+'_text') || {}).value || '').trim();
    patch['para'+i+'_text_en'] = ((document.getElementById('e_para'+i+'_text_en') || {}).value || '').trim();
    patch['youtube'+i] = ((document.getElementById('e_youtube'+i) || {}).value || '').trim();
    for(var j=1;j<=3;j++){
      patch['p'+i+'_img'+j+'_url'] = ((document.getElementById('e_p'+i+'_img'+j+'_url') || {}).value || '').trim();
    }
  }

  return patch;
}

function validatePatch(patch){
  Object.keys(patch).forEach(function(k){
    if(/^p\d+_img\d+_url$/.test(k) && patch[k]){
      if(!/^https:\/\//i.test(String(patch[k]).trim())){
        throw new Error(L().badImg + k);
      }
    }
    if(/^youtube\d+$/.test(k) && patch[k]){
      if(!isAllowedYouTube(String(patch[k]).trim())){
        throw new Error(L().badYoutube + k);
      }
    }
  });
}

function refreshTargetInfo(){
  var target = document.getElementById('targetInfo');
  target.value = gRowIndex ? (L().row + '=' + gRowIndex + (gFeature && gFeature.slug ? ' / ' + L().slug + '=' + gFeature.slug : '')) : '';
}

async function postApi(fn, payload){
  var url = window.EXEC_URL + (window.EXEC_URL.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();

  var r = await fetch(url,{
    method:'POST',
    mode:'cors',
    cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({
      fn:fn,
      payload:payload,
      csrf:(window.__CZ_CSRF||'')
    })
  });

  var text = await r.text();
  var j = null;

  try{
    j = JSON.parse(text);
  }catch(_){
    throw new Error(L().badJson + text.slice(0,120));
  }

  if(!r.ok || !j || !j.ok){
    throw new Error((j && (j.error || j.message)) || ('HTTP ' + r.status));
  }

  return j;
}

async function callGetFeatureById(arg, onOK, onNG){
  try{
    if(window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(onOK).withFailureHandler(onNG).getFeatureById(arg);
      return;
    }
  }catch(_){}

  try{
    const url1 = window.EXEC_URL + (window.EXEC_URL.indexOf('?')>=0?'&':'?')
      + 'fn=getFeatureById&payload=' + encodeURIComponent(JSON.stringify(arg))
      + '&v=' + Date.now();
    const r1 = await fetch(url1,{method:'GET',mode:'cors',cache:'no-store'});
    const ct = r1.headers.get('content-type')||'';
    if(r1.ok && ct.indexOf('application/json')>=0){
      onOK(await r1.json());
      return;
    }
  }catch(_){}

  try{
    onOK(await postApi('getFeatureById', arg));
  }catch(err){
    onNG(err);
  }
}

async function callEditEntry(payload, onOK, onNG){
  try{
    if(window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(onOK).withFailureHandler(onNG).editEntry(payload);
      return;
    }
  }catch(_){}

  try{
    onOK(await postApi('editEntry', payload));
  }catch(err){
    onNG(err);
  }
}

async function hydrateFeature(){
  if(!gRowIndex) return null;
  try{
    var res = await postApi('getFeatureById', {rowIndex:gRowIndex});
    if(res && res.ok && res.data){
      return res.data;
    }
  }catch(_){}
  return null;
}

function applyFeatureToScreen(data){
  gFeature = data || {};
  renderHeader(gFeature);
  renderBody(gFeature);
  renderAuthorFooter(gFeature);

  var idhint = document.getElementById('idhint');
  idhint.textContent = gFeature.slug
    ? (L().slug + ': '+gFeature.slug+' / ' + L().row + ': '+(gRowIndex||''))
    : (L().row + ': '+(gRowIndex||''));

  refreshTargetInfo();

  if(gIsEditOpen){
    fillEditForm(gFeature);
  }
}

  saveLang();
  setLangButtons();

  document.getElementById('btn-top').textContent = L().top;
  document.getElementById('backlink').textContent = L().backList;
  document.getElementById('backlink').href = './search_features.html?lang=' + encodeURIComponent(currentLang);

  document.getElementById('copyLinkBtn').textContent = L().copy;
  document.getElementById('shareXBtn').textContent = L().shareX;
  document.getElementById('shareFacebookBtn').textContent = L().facebook;
  document.getElementById('shareLineBtn').textContent = L().line;

  document.getElementById('editTitleText').textContent = L().editTitle;
  document.getElementById('editNoteText').textContent = L().editNote;
  document.getElementById('btnEditToggle').textContent = gIsEditOpen ? L().closeEdit : L().edit;
  document.getElementById('label-edit-key').textContent = L().editKey;
  document.getElementById('editKey').placeholder = L().editKeyPh;
  document.getElementById('label-target').textContent = L().target;
  document.getElementById('btnSave').textContent = L().save;
  document.getElementById('btnHide').textContent = L().hide;
  document.getElementById('btnUnhide').textContent = L().unhide;

  }
}

(function init(){
  try{
    var qsLang = qs('lang');
    var savedLang = localStorage.getItem('cz_lang');
    currentLang = (qsLang === 'en' || savedLang === 'en') ? 'en' : 'ja';
  }catch(_){
    currentLang = 'ja';
  }

  resolveExecUrl();
  setStaticUI();
  setupCopyButton();
  setupSnsShareButtons();

  document.getElementById('lang-ja').addEventListener('click', function(){
    currentLang = 'ja';
    setStaticUI();
  });

  document.getElementById('lang-en').addEventListener('click', function(){
    currentLang = 'en';
    setStaticUI();
  });

  document.getElementById('btnEditToggle').onclick = function(){
    if(gIsEditOpen) closeEditBox();
    else openEditBox();
  };

  document.getElementById('btnCancelEdit').onclick = function(){
    closeEditBox();
  };

  document.getElementById('btnSave').onclick = function(){
    clearBanners();

    if(gIsSaving) return;

    var key = (document.getElementById('editKey').value || '').trim();
    if(!key){
      showErrorText(L().needKey);
      return;
    }

    gLastEditKey = key;

    if(!gRowIndex){
      showErrorText(L().needRow);
      return;
    }

    if(!gIsEditOpen){
      openEditBox();
      return;
    }

    try{
      var patch = collectPatch();
      validatePatch(patch);

      var btn = document.getElementById('btnSave');
      gIsSaving = true;
      btn.disabled = true;
      btn.textContent = L().saving;

      callEditEntry({
        sheetName:'Features',
        rowIndex:gRowIndex,
        edit_key:key,
        action:'update',
        patch:patch
      }, async function(res){
        btn.disabled = false;
        btn.textContent = L().save;
        gIsSaving = false;

        if(!res || !res.ok){
          showErrorText((res && res.error) ? res.error : L().failed);
          return;
        }

        Object.assign(gFeature, patch);
        applyFeatureToScreen(gFeature);
        if(gLastEditKey){
          document.getElementById('editKey').value = gLastEditKey;
        }
        showOkText(L().saved);

        var fresh = await hydrateFeature();
        if(fresh){
          Object.assign(fresh, patch);
          applyFeatureToScreen(fresh);
          if(gLastEditKey){
            document.getElementById('editKey').value = gLastEditKey;
          }
          showOkText(L().saved);
        }
      }, function(err){
        btn.disabled = false;
        btn.textContent = L().save;
        gIsSaving = false;
        showErrorText(err && err.message ? err.message : L().failed);
      });
    }catch(e){
      gIsSaving = false;
      var btn2 = document.getElementById('btnSave');
      btn2.disabled = false;
      btn2.textContent = L().save;
      showErrorText(e && e.message ? e.message : L().failed);
    }
  };

  document.getElementById('btnHide').onclick = function(){
    clearBanners();
    var key = (document.getElementById('editKey').value || '').trim();
    if(!key){
      showErrorText(L().needKey);
      return;
    }

    gLastEditKey = key;

    if(!gRowIndex){
      showErrorText(L().needRow);
      return;
    }

    callEditEntry({
      sheetName:'Features',
      rowIndex:gRowIndex,
      edit_key:key,
      action:'delete'
    }, function(res){
      if(!res || !res.ok){
        showErrorText((res && res.error) ? res.error : L().failed);
        return;
      }
      if(gFeature) gFeature.is_hidden = true;
      showOkText(L().hidden);
    }, function(err){
      showErrorText(err && err.message ? err.message : L().failed);
    });
  };

  document.getElementById('btnUnhide').onclick = function(){
    clearBanners();
    var key = (document.getElementById('editKey').value || '').trim();
    if(!key){
      showErrorText(L().needKey);
      return;
    }

    gLastEditKey = key;

    if(!gRowIndex){
      showErrorText(L().needRow);
      return;
    }

    callEditEntry({
      sheetName:'Features',
      rowIndex:gRowIndex,
      edit_key:key,
      action:'restore'
    }, function(res){
      if(!res || !res.ok){
        showErrorText((res && res.error) ? res.error : L().failed);
        return;
      }
      if(gFeature) gFeature.is_hidden = false;
      showOkText(L().restored);
    }, function(err){
      showErrorText(err && err.message ? err.message : L().failed);
    });
  };

  var row = qs('row');
  var slug = qs('slug');

  callGetFeatureById(
    row ? { rowIndex:Number(row)||0 } : (slug ? { slug:String(slug) } : { rowIndex:0 }),
    function(res){
      try{
        if(!res || !res.ok || !res.data){
          showErrorText(L().needTarget);
          return;
        }

        var d = res.data || {};
        gFeature = d;
        gRowIndex = Number(res.rowIndex || d.rowIndex || row || 0);

        var st = String(d.status||'').toLowerCase();
        if(st && st!=='published'){
          showErrorText(L().private);
        }

        applyFeatureToScreen(d);
      }catch(_){
        showErrorText(L().needTarget);
      }
    },
    function(){
      showErrorText(L().needTarget);
    }
  );
})();
</script>
