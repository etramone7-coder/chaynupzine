<style>

    position:relative;
    width:min(96vw, 900px);

  .hotspot:focus-visible{ outline:2px dashed #000; outline-offset:2px; }

  .hotspot.records{  left:6%;  top:20%; width:40%; height:18%; }
  .hotspot.features{ left:40%; top:43%; width:35%; height:10%; }
  .hotspot.lives{    left:40%; top:70%; width:35%; height:15%; transform:rotate(-10deg); }

  .btn{
    display:inline-block; margin:10px 8px 0;
    background:#fff; color:#000;
    padding:12px 18px; font-size:16px; font-weight:800;

    width:min(92vw, 860px);
    margin:0 auto 12px;
    padding:10px 12px;
