<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAYNUPZINE — Lives search</title>
<style>
  :root{ --card-bg: rgba(255,255,255,.92); --chip:#eef1f5; --txt:#222; }
  html,body{
    height:100%; margin:0; background:transparent; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:20px;
  }
  .bg{
    position:fixed; inset:0;
    background-color:#f3f5f7;
    background-image:url("https://etramone7-coder.github.io/chaynupzine/assets/bg_lives_search.webp");
    background-size:cover; background-position:center;
    filter:brightness(.88);
    z-index:0;
  }
  .wrap{max-width:980px; margin:28px auto; padding:0 16px; position:relative; z-index:1}
  .panel{
    background:rgba(255,255,255,0.6); backdrop-filter:saturate(120%) blur(10px);
    border-radius:16px; box-shadow:0 10px 28px rgba(0,0,0,.16);
    padding:20px 20px 12px; min-height:860px; position:relative
  }
  .langbar{display:flex; justify-content:flex-end; gap:8px; margin-bottom:8px}
  .langbtn{
    border:1px solid #ddd; background:#fff; color:#111; border-radius:999px;
    padding:8px 12px; font-size:14px; font-weight:900; cursor:pointer;
  }
  .langbtn.active{background:#111; color:#fff; border-color:#111}
  h1{font-size:24px; margin:0 0 10px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .brand{display:inline-block; background:#111; color:#fff; border-radius:8px; padding:7px 12px; font-weight:800; letter-spacing:.4px}
  .sub{font-size:16px; color:#555}
  .chips{display:flex; flex-wrap:wrap; gap:12px; margin:12px 0 8px}
  .chip{padding:12px 16px; border-radius:999px; background:var(--chip); cursor:pointer; font-size:18px; font-weight:700; user-select:none; line-height:1}
  .chip.active{background:#111; color:#fff}
  .row{margin:14px 0 20px; border-top:1px dashed #ddd; padding-top:12px}
  .sel{font-size:15px; color:#666; margin-top:7px}
  .actions{display:flex; justify-content:flex-end; gap:12px; margin:12px 0; align-items:center; flex-wrap:wrap}
  .btn{border:0; border-radius:14px; padding:12px 16px; background:#111; color:#fff; font-weight:800; cursor:pointer; font-size:18px}
  .btn.ghost{background:#fff; color:#111; border:1px solid #ddd}
  .btn[disabled]{opacity:.5; cursor:not-allowed}
  .btn-link{display:inline-block; text-decoration:none}
  .list-compact{display:grid; grid-template-columns:repeat(1,1fr); gap:14px; margin-top:12px}
  .resultbox{padding:12px; background:rgba(255,255,255,0.6); border:1px solid #eee; border-radius:12px; color:#333}
  .resultbox:hover{box-shadow:0 8px 20px rgba(0,0,0,.12); transform:translateY(-1px)}
  .alert{margin:12px 0; padding:12px; border-radius:14px; background:#ffe9e9; color:#a33; border:1px solid #f6bcbc; font-size:16px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="bg" class="bg"></div>
<div class="wrap">
  <div class="panel">
    <div class="langbar">
      <button type="button" class="langbtn" id="lang-ja">JP</button>
      <button type="button" class="langbtn" id="lang-en">EN</button>
    </div>

    <h1>
      <span class="brand">CHAYNUPZINE</span>
      <span class="sub" id="title-sub">Lives — search & listing</span>
    </h1>

    <details id="guide" style="margin:10px 0;padding:10px;background:#fafafa;border:1px solid #ccc;border-radius:8px">
      <summary id="guide-summary" style="cursor:pointer;font-weight:700">使い方ガイド</summary>
      <div id="guide-body"></div>
    </details>

    <p class="sub" id="subtitle">ジャンル / 地方・県 / 月 / バンド頭文字 で絞り込みできます（複数可）。</p>

    <div class="row"><div class="chips" id="chips-genre"></div><div class="sel" id="sel-genre"></div></div>
    <div class="row"><div class="chips" id="chips-region"></div><div class="sel" id="sel-region"></div></div>
    <div class="row" id="pref-row" style="display:none"><div class="chips" id="chips-pref"></div><div class="sel" id="sel-pref"></div></div>
    <div class="row"><div class="chips" id="chips-month"></div><div class="sel" id="sel-month"></div></div>
    <div class="row"><div class="chips" id="chips-initial"></div><div class="sel" id="sel-initial"></div></div>

    <div class="actions">
      <a class="btn ghost btn-link" id="btn-top"  href="https://etramone7-coder.github.io/chaynupzine/" target="_top" rel="noopener noreferrer">トップへ戻る</a>
      <a class="btn ghost btn-link" id="btn-form" href="https://etramone7-coder.github.io/chaynupzine/submit_live.html" target="_top" rel="noopener noreferrer">ライブ投稿フォームへ</a>
      <button class="btn ghost" id="btn-reset" type="button">条件リセット</button>
      <button class="btn" id="btn-search" type="button" disabled>検索</button>
    </div>

    <div id="result-alert" class="alert hidden"></div>
    <div id="results" class="list-compact"></div>
    <div class="sel" id="foot-sel"></div>
  </div>
</div>

<script>
(function(){
  var TEXTS = {
    ja:{
      titleSub:"Lives — search & listing",
      subtitle:"ジャンル / 地方・県 / 月 / バンド頭文字 で絞り込みできます（複数可）。",
      guideSummary:"使い方ガイド",
      guideBody:'<ul style="margin:8px 0 0 18px;font-size:15px;line-height:1.6"><li>ジャンル・地方・県・月・バンド頭文字を自由に組み合わせて検索できます。</li><li><b>どれか一つの条件だけを選んでも検索可能です。</b></li><li>「条件リセット」で全ての絞り込みを解除します。</li><li>結果をクリックすると詳細ページに移動します。</li></ul>',
      genre:"ジャンル",
      region:"地方",
      pref:"県",
      month:"月",
      initial:"バンド頭文字",
      reset:"条件リセット",
      search:"検索",
      none:"指定なし",
      regionOnly:"地方のみで検索可",
      condition:"条件",
      reading:"読み込み中…",
      nohit:"該当データがありません。条件を変えて試してください。",
      fail:"読み込みに失敗しました。",
      backTop:"トップへ戻る",
      toForm:"ライブ投稿フォームへ",
      open:"OPEN ",
      start:"START ",
      at:"@ ",
      status:{scheduled:"開催予定",canceled:"中止",done:"終了"},
      monthLabel:function(m){ return m + "月"; },
      regions:{
        '北海道・東北':'北海道・東北',
        '関東':'関東',
        '中部':'中部',
        '近畿':'近畿',
        '中国':'中国',
        '四国':'四国',
        '九州・沖縄':'九州・沖縄'
      },
      prefs:null
    },
    en:{
      titleSub:"Lives — Search & List",
      subtitle:"Filter by genre, region / prefecture, month, and band initial. Multiple filters can be combined.",
      guideSummary:"Search guide",
      guideBody:'<ul style="margin:8px 0 0 18px;font-size:15px;line-height:1.6"><li>You can freely combine genre, region, prefecture, month, and band initial filters.</li><li><b>You can search with only one selected filter.</b></li><li>Use “Reset filters” to clear all selected filters.</li><li>Click a result to open its detail page.</li></ul>',
      genre:"Genre",
      region:"Region",
      pref:"Prefecture",
      month:"Month",
      initial:"Band initial",
      reset:"Reset filters",
      search:"Search",
      none:"None",
      regionOnly:"region-only search allowed",
      condition:"Filters",
      reading:"Loading…",
      nohit:"No matching live posts found. Try changing the filters.",
      fail:"Failed to load live posts.",
      backTop:"Back to top",
      toForm:"Submit live",
      open:"OPEN ",
      start:"START ",
      at:"@ ",
      status:{scheduled:"Scheduled",canceled:"Canceled",done:"Done"},
      monthLabel:function(m){ return String(m); },
      regions:{
        '北海道・東北':'Hokkaido / Tohoku',
        '関東':'Kanto',
        '中部':'Chubu',
        '近畿':'Kinki',
        '中国':'Chugoku',
        '四国':'Shikoku',
        '九州・沖縄':'Kyushu / Okinawa'
      },
      prefs:{
        '北海道':'Hokkaido','青森県':'Aomori','岩手県':'Iwate','宮城県':'Miyagi','秋田県':'Akita','山形県':'Yamagata','福島県':'Fukushima',
        '茨城県':'Ibaraki','栃木県':'Tochigi','群馬県':'Gunma','埼玉県':'Saitama','千葉県':'Chiba','東京都':'Tokyo','神奈川県':'Kanagawa',
        '新潟県':'Niigata','富山県':'Toyama','石川県':'Ishikawa','福井県':'Fukui','山梨県':'Yamanashi','長野県':'Nagano','岐阜県':'Gifu','静岡県':'Shizuoka','愛知県':'Aichi',
        '三重県':'Mie','滋賀県':'Shiga','京都府':'Kyoto','大阪府':'Osaka','兵庫県':'Hyogo','奈良県':'Nara','和歌山県':'Wakayama',
        '鳥取県':'Tottori','島根県':'Shimane','岡山県':'Okayama','広島県':'Hiroshima','山口県':'Yamaguchi',
        '徳島県':'Tokushima','香川県':'Kagawa','愛媛県':'Ehime','高知県':'Kochi',
        '福岡県':'Fukuoka','佐賀県':'Saga','長崎県':'Nagasaki','熊本県':'Kumamoto','大分県':'Oita','宮崎県':'Miyazaki','鹿児島県':'Kagoshima','沖縄県':'Okinawa'
      }
    }
  };

  var currentLang = 'ja';

  try{
    var qsLang = new URLSearchParams(location.search).get('lang');
    var savedLang = localStorage.getItem('cz_lang');
    currentLang = (qsLang === 'en' || savedLang === 'en') ? 'en' : 'ja';
  }catch(_){
    currentLang = 'ja';
  }

  function TX(){
    return TEXTS[currentLang] || TEXTS.ja;
  }

  function saveLang(){
    try{ localStorage.setItem('cz_lang', currentLang); }catch(_){}
    try{ document.documentElement.lang = currentLang; }catch(_){}
  }

  function setLangButtons(){
    var ja = document.getElementById('lang-ja');
    var en = document.getElementById('lang-en');
    if(ja) ja.classList.toggle('active', currentLang === 'ja');
    if(en) en.classList.toggle('active', currentLang === 'en');
  }

  function labelRegion(region){
    if(!region) return '';
    return TX().regions[region] || region;
  }

  function labelPref(pref){
    if(!pref) return '';
    if(currentLang === 'en' && TX().prefs && TX().prefs[pref]) return TX().prefs[pref];
    return pref;
  }

  function pickLang(it, base){
    if(!it) return '';
    if(currentLang === 'en'){
      return String(it[base + '_en'] || it[base] || '').trim();
    }
    return String(it[base] || it[base + '_en'] || '').trim();
  }

  var GENRES = [
    {code:"Punk",label:"Punk"},{code:"Hardcore",label:"Hardcore"},{code:"PowerPop",label:"PowerPop"},
    {code:"Indie",label:"Indie"},{code:"Garage",label:"Garage"},{code:"Mods",label:"Mods"},
    {code:"NeoMods",label:"NeoMods"},{code:"Metal",label:"Metal"},{code:"HardRock",label:"HardRock"},
    {code:"Reggae",label:"Reggae"},{code:"Rock",label:"Rock"},{code:"Pop",label:"Pop"},
    {code:"Melodicore",label:"Melodicore"},{code:"Rockabilly",label:"Rockabilly"},{code:"Other",label:"Other"},
    {code:"Glam",label:"Glam"}
  ];

  var REGION_MAP_JA = {
    '北海道・東北':['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県'],
    '関東':['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県'],
    '中部':['新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県'],
    '近畿':['三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],
    '中国':['鳥取県','島根県','岡山県','広島県','山口県'],
    '四国':['徳島県','香川県','愛媛県','高知県'],
    '九州・沖縄':['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県']
  };

  var MONTHS = Array.from({length:12}, function(_,i){ return (i+1); });
  var INITIALS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');

  var state = {genre:'', region:'', prefectures:[], months:[], initial:''};
  var gLastResults = null;

  (function resolveExecUrl(){
    try{
      var injected = (window.EXEC_URL||'').trim();
      var viaQuery = new URLSearchParams(location.search).get('exec') || '';
      if (!injected || injected.indexOf('<?=') === 0) injected = '';
      var fallback = 'https://script.google.com/macros/s/AKfycbznOw5AqZl9NqA1JvCgZqVI5HmmlIXTWG59CTuRO81s47lwzijy7XDAFOk7SpTQl76HZw/exec';
      window.EXEC_URL = injected || viaQuery || fallback;
    }catch(_){
      window.EXEC_URL = 'https://script.google.com/macros/s/AKfycbznOw5AqZl9NqA1JvCgZqVI5HmmlIXTWG59CTuRO81s47lwzijy7XDAFOk7SpTQl76HZw/exec';
    }
  })();

  async function callListLives(payload, onOK, onNG){
    try{
      if (window.google && google.script && google.script.run){
        google.script.run.withSuccessHandler(onOK).withFailureHandler(onNG).listLives(payload);
        return;
      }
    }catch(_){}
    try{
      var url1 = window.EXEC_URL
        + (window.EXEC_URL.indexOf('?')>=0?'&':'?')
        + 'fn=listLives&payload=' + encodeURIComponent(JSON.stringify(payload))
        + '&v=' + Date.now();
      var r1 = await fetch(url1, {method:'GET', mode:'cors', cache:'no-store', credentials:'omit', redirect:'follow'});
      var ct = r1.headers.get('content-type') || '';
      if (r1.ok && ct.indexOf('application/json')>=0){
        onOK(await r1.json());
        return;
      }
    }catch(_){}

    try{
      var r2 = await fetch(window.EXEC_URL + (window.EXEC_URL.indexOf('?')>=0?'&':'?') + 'v=' + Date.now(), {
        method:'POST', mode:'cors', cache:'no-store', credentials:'omit', redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ fn:'listLives', payload, csrf:(window.__CZ_CSRF||'') })
      });
      if(r2.ok){
        onOK(await r2.json());
        return;
      }
    }catch(_){}

    try{
      var body = new URLSearchParams();
      body.set('fn','listLives');
      body.set('payload', JSON.stringify(payload));
      body.set('csrf', (window.__CZ_CSRF||''));
      var r3 = await fetch(window.EXEC_URL + (window.EXEC_URL.indexOf('?')>=0?'&':'?') + 'v=' + Date.now(), {
        method:'POST', mode:'cors', cache:'no-store', credentials:'omit', redirect:'follow',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=utf-8'},
        body: body.toString()
      });
      if(!r3.ok){ throw new Error('HTTP '+r3.status); }
      onOK(await r3.json());
    }catch(err){ onNG(err); }
  }

  function chipEl(label, active, onClick){
    var el=document.createElement('div');
    el.className='chip'+(active?' active':'');
    el.textContent=label;
    el.onclick=onClick;
    return el;
  }

  function drawGenre(){
    var wrap=document.getElementById('chips-genre');
    wrap.innerHTML='';
    GENRES.forEach(function(g){
      wrap.appendChild(chipEl(g.label, state.genre===g.code, function(){
        state.genre=(state.genre===g.code)?'':g.code;
        drawGenre(); updateSels(); updateSearchEnabled();
      }));
    });
    document.getElementById('sel-genre').textContent = TX().genre+': '+(state.genre||TX().none);
  }

  function drawRegion(){
    var wrap=document.getElementById('chips-region');
    wrap.innerHTML='';
    Object.keys(REGION_MAP_JA).forEach(function(rJA){
      wrap.appendChild(chipEl(labelRegion(rJA), state.region===rJA, function(){
        state.region=(state.region===rJA)?'':rJA;
        state.prefectures=[];
        drawRegion(); drawPref(); updateSels(); updateSearchEnabled();
      }));
    });
    document.getElementById('sel-region').textContent = TX().region+': '+(state.region ? labelRegion(state.region) : TX().none);
  }

  function drawPref(){
    var row=document.getElementById('pref-row');
    var wrap=document.getElementById('chips-pref');
    var sel=document.getElementById('sel-pref');
    wrap.innerHTML='';
    if(!state.region){ row.style.display='none'; sel.textContent=''; return; }
    row.style.display='';
    (REGION_MAP_JA[state.region]||[]).forEach(function(pJA){
      var active=state.prefectures.includes(pJA);
      wrap.appendChild(chipEl(labelPref(pJA), active, function(){
        var i=state.prefectures.indexOf(pJA);
        if(i>=0) state.prefectures.splice(i,1); else state.prefectures.push(pJA);
        drawPref(); updateSels(); updateSearchEnabled();
      }));
    });
    sel.textContent =
      TX().pref + ': ' +
      (state.prefectures.length
        ? state.prefectures.map(labelPref).join('/')
        : (TX().none + '（' + TX().regionOnly + '）'));
  }

  function drawMonth(){
    var wrap=document.getElementById('chips-month');
    wrap.innerHTML='';
    MONTHS.forEach(function(m){
      var active=state.months.includes(m);
      wrap.appendChild(chipEl(TX().monthLabel(m), active, function(){
        var i=state.months.indexOf(m);
        if(i>=0) state.months.splice(i,1); else state.months.push(m);
        drawMonth(); updateSels(); updateSearchEnabled();
      }));
    });
    document.getElementById('sel-month').textContent=TX().month+': '+(state.months.length?state.months.join('/') : TX().none);
  }

  function drawInitial(){
    var wrap=document.getElementById('chips-initial');
    wrap.innerHTML='';
    INITIALS.forEach(function(ch){
      wrap.appendChild(chipEl(ch, state.initial===ch, function(){
        state.initial=(state.initial===ch)?'':ch;
        drawInitial(); updateSels(); updateSearchEnabled();
      }));
    });
    document.getElementById('sel-initial').textContent=TX().initial+': '+(state.initial||TX().none);
  }

  function updateSels(){
    var foot=TX().condition + ': '
      + TX().genre+':' +(state.genre||TX().none)+'　'
      + TX().region+':' +(state.region ? labelRegion(state.region) : TX().none)+'　'
      + (state.region ? (TX().pref+':' + (state.prefectures.length ? state.prefectures.map(labelPref).join('/') : TX().none) + '　') : '')
      + TX().month+':' +(state.months.length?state.months.join('/') : TX().none)+'　'
      + TX().initial+':' +(state.initial||TX().none);
    document.getElementById('foot-sel').textContent=foot;
  }

  function hasAnySelection(){ return state.genre||state.region||state.prefectures.length||state.months.length||state.initial; }
  function updateSearchEnabled(){ document.getElementById('btn-search').disabled=!hasAnySelection(); }

  function toStatusLabel(v){
    return (TX().status && TX().status[v]) ? TX().status[v] : v;
  }

  function formatDateOnly(v){
    try{
      if(!v) return '';
      if(v instanceof Date && !isNaN(v.getTime())){
        return v.getFullYear()+'/'+String(v.getMonth()+1).padStart(2,'0')+'/'+String(v.getDate()).padStart(2,'0');
      }
      var s = String(v).trim();
      if(!s) return '';

      var m0 = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if(m0) return m0[1]+'/'+m0[2]+'/'+m0[3];

      s = s.replace(/[.\-]/g,'/');
      var m1 = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      if(m1){
        return m1[1]+'/'+String(m1[2]).padStart(2,'0')+'/'+String(m1[3]).padStart(2,'0');
      }

      var d = new Date(s);
      if(!isNaN(d.getTime())){
        return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
      }

      return String(v);
    }catch(_){
      return String(v||'');
    }
  }

  function formatTimeOnly(v){
    try{
      if(v==null) return '';
      var s = String(v).trim();
      if(!s) return '';

      if(v instanceof Date && !isNaN(v.getTime())){
        return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
      }

      var m1 = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
      if(m1){
        return String(m1[1]).padStart(2,'0')+':'+m1[2];
      }

      s = s.replace(/[．。]/g,':').replace(/[時]/g,':').replace(/[分]/g,'');
      var m2 = s.match(/(\d{1,2})\s*:\s*(\d{2})/);
      if(m2){
        return String(m2[1]).padStart(2,'0')+':'+m2[2];
      }

      var m3 = s.replace(/[^\d]/g,'');
      if(/^\d{3,4}$/.test(m3)){
        m3 = ('0000'+m3).slice(-4);
        return m3.slice(0,2)+':'+m3.slice(2,4);
      }

      var m4 = s.match(/^(\d{1,2})$/);
      if(m4){
        return String(m4[1]).padStart(2,'0')+':00';
      }

      return String(v);
    }catch(_){
      return String(v||'');
    }
  }

  function showAlert(msg){
    var box=document.getElementById('result-alert');
    box.textContent=msg;
    box.classList.remove('hidden');
  }
  function hideAlert(){ document.getElementById('result-alert').classList.add('hidden'); }

  function renderResultCards(items){
    var res = document.getElementById('results');
    res.innerHTML = '';
    if(!items || !items.length) return;

    items.forEach(function(it){
      var box = document.createElement('div');
      box.className = 'resultbox';
      box.style.cursor = 'pointer';

      box.onclick = function(){
        const row = encodeURIComponent(it.rowIndex || '');
        location.href = 'lives_browse.html?row=' + row + '&lang=' + encodeURIComponent(currentLang);
      };

      var regionLabel = pickLang(it, 'region') || labelRegion(it.region || '');
      var prefLabel   = pickLang(it, 'prefecture') || labelPref(it.prefecture || '');

      var st = document.createElement('div');
      st.textContent = '[' + toStatusLabel(it.status) + ']'
        + (regionLabel ? ' ' + regionLabel : '')
        + (prefLabel ? ' / ' + prefLabel : '');
      box.appendChild(st);

      var ttl = document.createElement('div');
      ttl.style.fontWeight='700';
      ttl.style.fontSize='18px';
      ttl.textContent = pickLang(it, 'title') || '';
      box.appendChild(ttl);

      var bands = document.createElement('div');
      bands.textContent = it.artist || '';
      box.appendChild(bands);

      var meta = document.createElement('div');
      meta.style.opacity = '.85';
      var parts=[];

      var d = formatDateOnly(it.date);
      if(d) parts.push(d);

      var ot = formatTimeOnly(it.open_time);
      if(ot) parts.push(TX().open + ot);

      var stt = formatTimeOnly(it.start_time);
      if(stt) parts.push(TX().start + stt);

      var venue = pickLang(it, 'venue');
      if(venue) parts.push(TX().at + venue);

      meta.textContent = parts.join('  ');
      box.appendChild(meta);

      var price = pickLang(it, 'price');
      if(price){
        var pr = document.createElement('div');
        pr.style.marginTop = '4px';
        pr.style.opacity = '.85';
        pr.textContent = price;
        box.appendChild(pr);
      }

      var desc = pickLang(it, 'description');
      if(desc){
        var de = document.createElement('div');
        de.style.marginTop = '6px';
        de.textContent = desc;
        box.appendChild(de);
      }

      res.appendChild(box);
    });
  }

  function doSearch(){
    document.getElementById('results').innerHTML='';
    hideAlert();
    showAlert(TX().reading);

    var payload={genre:state.genre,region:state.region,prefectures:state.prefectures,months:state.months,initial:state.initial};

    callListLives(payload, function(out){
      hideAlert();
      if(!out||!out.ok){ showAlert(TX().fail); return; }
      if(!out.items||!out.items.length){ showAlert(TX().nohit); return; }

      gLastResults = out.items.slice();
      renderResultCards(gLastResults);
    }, function(){
      hideAlert(); showAlert(TX().fail);
    });
  }

  function resetAll(){
    state.genre=''; state.region=''; state.prefectures=[];
    state.months=[]; state.initial='';
    drawGenre(); drawRegion(); drawPref(); drawMonth(); drawInitial();
    updateSels(); updateSearchEnabled();
    document.getElementById('results').innerHTML='';
    hideAlert();
    gLastResults = null;
  }

  function setUI(){
    saveLang();
    setLangButtons();

    document.title = currentLang === 'en' ? 'CHAYNUPZINE — Lives search' : 'CHAYNUPZINE — ライブ検索';

    document.getElementById('title-sub').textContent = TX().titleSub;
    document.getElementById('subtitle').textContent = TX().subtitle;
    document.getElementById('guide-summary').textContent = TX().guideSummary;
    document.getElementById('guide-body').innerHTML = TX().guideBody;
    document.getElementById('btn-reset').textContent = TX().reset;
    document.getElementById('btn-search').textContent = TX().search;
    document.getElementById('btn-top').textContent  = TX().backTop;
    document.getElementById('btn-form').textContent = TX().toForm;
    document.getElementById('btn-form').href = 'https://etramone7-coder.github.io/chaynupzine/submit_live.html?lang=' + encodeURIComponent(currentLang);

    drawGenre();
    drawRegion();
    drawPref();
    drawMonth();
    drawInitial();
    updateSels();
    updateSearchEnabled();

    if(gLastResults && gLastResults.length){
      renderResultCards(gLastResults);
    }
  }

  document.getElementById('lang-ja').addEventListener('click', function(){
    currentLang = 'ja';
    setUI();
  });

  document.getElementById('lang-en').addEventListener('click', function(){
    currentLang = 'en';
    setUI();
  });

  document.getElementById('btn-reset').onclick=resetAll;
  document.getElementById('btn-search').onclick=doSearch;

  setUI();

})();
</script>
</body>
</html>
